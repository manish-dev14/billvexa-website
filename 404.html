<!doctype html>
<html lang="en-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Page not found — BillVexa</title>
<meta name="robots" content="noindex" />
<!-- Root-relative paths on purpose: this page is served at any missing URL, e.g. /a/b/c -->
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&amp;icon_names=arrow_back,dark_mode,light_mode&amp;display=block" rel="stylesheet" />
<link rel="stylesheet" href="/legal.css" />
<style>
.nf { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding-block: 48px; }
.nf-code { font-size: clamp(4.5rem, 3rem + 8vw, 8rem); font-weight: 800; line-height: 1; letter-spacing: -.04em;
  background: linear-gradient(135deg, #1976D2, #00C853); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nf h1 { font-size: clamp(1.4rem, 1.1rem + 1.2vw, 2rem); }
.nf p { max-width: 460px; color: var(--ink-soft); }
.nf-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
</style>
<script>
(function () {
  try {
    var t = localStorage.getItem('billvexa-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* storage unavailable — fall back to the system theme */ }
})();
</script>
</head>
<body>
<header class="nav">
  <div class="container nav-inner">
    <a href="/" class="brand" aria-label="BillVexa home">
      <span class="brand-mark" aria-hidden="true">BV</span>
      BillVexa
    </a>
    <div class="nav-actions">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="material-symbols-outlined icon-light" aria-hidden="true">dark_mode</span>
        <span class="material-symbols-outlined icon-dark" aria-hidden="true">light_mode</span>
      </button>
      <a href="/#demo" class="btn">Free Demo</a>
    </div>
  </div>
</header>

<main class="container nf">
  <div class="nf-code" aria-hidden="true">404</div>
  <h1>This page isn't on our shelves</h1>
  <p>The link may be old or mistyped. Head back home, or book a free demo and we'll show you BillVexa.</p>
  <div class="nf-actions">
    <a href="/" class="btn">Go to home page</a>
    <a href="/#demo" class="btn">Book a Free Demo</a>
  </div>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <span>© 2026 BillVexa. All rights reserved.</span>
    <nav class="footer-links" aria-label="Legal">
      <a href="/">Home</a>
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/terms.html">Terms of Service</a>
      <a href="mailto:sales@billvexa.in">Contact</a>
    </nav>
  </div>
</footer>

<script>
(function () {
  'use strict';
  var root = document.documentElement;
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var current = root.getAttribute('data-theme') || (systemDark ? 'dark' : 'light');
    var next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('billvexa-theme', next); } catch (e) { /* ignore */ }
  });
})();
</script>
</body>
</html>
